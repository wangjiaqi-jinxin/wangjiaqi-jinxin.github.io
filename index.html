<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="wangjiaqi-jinxin 的个人博客。" />
    <meta name="theme-color" content="#113642" />
    <title>王家琪的博客</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23113642'/%3E%3Cpath d='M18 17h28v7H25v9h17v7H25v14h-7V17Z' fill='%23f6eee0'/%3E%3C/svg%3E" />
    <style>
      :root { --ink:#113642; --paper:#f7f4ed; --line:#d9d7cd; --accent:#d84a31; --muted:#5f6867; }
      * { box-sizing:border-box; }
      body { margin:0; color:var(--ink); background:var(--paper); font-family:ui-serif, Georgia, "Noto Serif SC", serif; }
      a { color:inherit; text-decoration:none; }
      .wrap { max-width:1050px; margin:auto; padding:0 28px; }
      header { border-bottom:1px solid var(--line); }
      .nav { min-height:76px; display:flex; justify-content:space-between; align-items:center; gap:24px; }
      .mark { font-family:ui-sans-serif, system-ui, sans-serif; font-weight:800; letter-spacing:.04em; }
      .nav-links { display:flex; gap:21px; font-family:ui-sans-serif, system-ui, sans-serif; font-size:.9rem; }
      .nav-links a:hover { color:var(--accent); }
      main { padding:100px 0 76px; }
      .eyebrow { color:var(--accent); font:700 .76rem/1 ui-sans-serif, system-ui, sans-serif; letter-spacing:.13em; text-transform:uppercase; }
      h1 { max-width:760px; margin:20px 0 28px; font-size:clamp(2.6rem, 6vw, 5.5rem); line-height:.98; letter-spacing:-.055em; }
      .intro { max-width:560px; margin:0; color:var(--muted); font-size:1.15rem; line-height:1.8; }
      .rule { margin:76px 0 0; border:0; border-top:1px solid var(--line); }
      .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:30px 0 3px; font-family:ui-sans-serif, system-ui, sans-serif; }
      .section-head h2 { margin:0; font-size:1rem; }
      .section-head span { color:var(--muted); font-size:.8rem; }
      .post { display:grid; grid-template-columns:120px 1fr; gap:28px; padding:30px 0; border-bottom:1px solid var(--line); }
      time { color:var(--muted); font:500 .82rem/1.5 ui-sans-serif, system-ui, sans-serif; }
      .post h3 { margin:0 0 10px; font-size:clamp(1.45rem, 3vw, 2.15rem); line-height:1.15; letter-spacing:-.035em; }
      .post h3 a:hover { color:var(--accent); }
      .post p { max-width:620px; margin:0; color:var(--muted); font-size:1rem; line-height:1.75; }
      footer { padding:28px 0 40px; color:var(--muted); font:500 .8rem/1.5 ui-sans-serif, system-ui, sans-serif; }
      @media (max-width:600px) { .wrap{padding:0 20px} .nav{min-height:64px} .nav-links{gap:14px;font-size:.82rem} main{padding:64px 0 48px} .post{grid-template-columns:1fr;gap:10px;padding:25px 0} .rule{margin-top:54px} }
    </style>
  </head>
  <body>
    <header>
      <nav class="wrap nav" aria-label="主导航">
        <a class="mark" href="/">WJQ / NOTES</a>
        <div class="nav-links">
          <a href="#writing">文章</a>
          <a href="mailto:hello@example.com">联系</a>
        </div>
      </nav>
    </header>
    <main class="wrap">
      <p class="eyebrow">Personal notebook</p>
      <h1>记录正在发生的思考。</h1>
      <p class="intro">这里是 wangjiaqi-jinxin 的个人博客。关于学习、工作、生活中值得慢下来想一想的事，都写在这里。</p>
      <hr class="rule" />
      <section id="writing" aria-labelledby="writing-title">
        <div class="section-head"><h2 id="writing-title">最新文章</h2><span>持续更新</span></div>
        <article class="post">
          <time datetime="2026-09-20">2026.09.20</time>
          <div>
            <h3><a href="#">从这里开始写作</a></h3>
            <p>第一篇文章留给开始。把重要的念头写下来，也把那些暂时没有答案的问题留下来。</p>
          </div>
        </article>
      </section>
    </main>
    <footer class="wrap">© 2026 wangjiaqi-jinxin · Built with GitHub Pages</footer>
  </body>
</html>
